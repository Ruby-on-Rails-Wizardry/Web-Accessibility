    <select onfocus="void('location = /locale/' + this.value)">
      <option value="en">English</option>
    </select>
  - |
    <input id="jump-fb" onfocus="void('location = /search')">
  - |
    <a href="/help" onfocus="void('window.open(/help-popup)')">Help</a>
  - |
    <select onfocus="void('document.location = /es')">
      <option value="es">Español</option>
    </select>
  - |
    <button type="button" onfocus="void('location = /next')">Continue</button>
  - |
    <textarea onfocus="void('href = /notes')"></textarea>

