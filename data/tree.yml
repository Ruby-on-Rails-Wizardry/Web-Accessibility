# Knowledge tree. Study pages live under source/learn/<id>.html.md.
# Isolated examples live under source/learn/<rule>/{bad,good}.html.erb.
# Practice items live under source/learn/<rule>/{pick,fix}.html.erb.
# prereqs / children are node ids. spine is the first-principles trace.
# kind: foundation | orientation | pattern | rule | example | practice
# pattern = a family of rules. rule = one cop (bad and good on the same page).
# example = live specimen of that rule, opened alone so tools see only that markup.
# practice = locator (pick) or constructed (fix) item with an in-house Check.

