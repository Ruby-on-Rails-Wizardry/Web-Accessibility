# Knowledge tree. Pages live under source/learn/<id>.html.md.
# prereqs / children are node ids. spine is the first-principles trace.
# kind: foundation | orientation | pattern

nodes:
  - id: equal-worth
    title: Equal worth and respect
    path: /learn/equal-worth/
    kind: foundation
    layer: 0
    prereqs: []
    children:
      - not-identical-capacity
      - comparable-access
    spine:
      - equal-worth
    library: []

  - id: not-identical-capacity
    title: Worth is not identical capacity
    path: /learn/not-identical-capacity/
    kind: foundation
    layer: 1
    prereqs:
      - equal-worth
    children: []
    spine:
      - equal-worth
      - not-identical-capacity
    library: []

  - id: comparable-access
    title: Comparable access to what we offer
    path: /learn/comparable-access/
    kind: foundation
    layer: 1
    prereqs:
      - equal-worth
    children:
      - web-for-everyone
      - pour
      - who-is-shut-out
    spine:
      - equal-worth
      - comparable-access
    library:
      - title: Section 508 law
        path: /docs/section-508/

  - id: web-for-everyone
    title: The web is for everyone
    path: /learn/web-for-everyone/
    kind: foundation
    layer: 2
    prereqs:
      - comparable-access
    children:
      - pour
    spine:
      - equal-worth
      - comparable-access
      - web-for-everyone
    library: []

  - id: pour
    title: POUR
    path: /learn/pour/
    kind: foundation
    layer: 2
    prereqs:
      - comparable-access
    children:
      - accessible-name
      - decorative-vs-informative-image
      - color-not-only-cue
      - headings
      - native-control
      - keyboard-access
    spine:
      - equal-worth
      - comparable-access
      - pour
    library:
      - title: Accessibility principles (POUR)
        path: /docs/wcag/principles/

  - id: who-is-shut-out
    title: Who is shut out
    path: /learn/who-is-shut-out/
    kind: foundation
    layer: 2
    prereqs:
      - comparable-access
    children:
      - which-name
    spine:
      - equal-worth
      - comparable-access
      - who-is-shut-out
    library:
      - title: Cognitive accessibility overview
        path: /docs/cognitive/

  - id: which-name
    title: Which name to use
    path: /learn/which-name/
    kind: orientation
    layer: 3
    prereqs:
      - who-is-shut-out
    children:
      - profiles
    spine:
      - equal-worth
      - comparable-access
      - which-name
    library:
      - title: WCAG, 508, and ADA — which name
        path: /docs/which-name/

  - id: profiles
    title: Requirement profiles
    path: /learn/profiles/
    kind: orientation
    layer: 3
    prereqs:
      - which-name
    children:
      - conformance
    spine:
      - equal-worth
      - comparable-access
      - which-name
      - profiles
