[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "section508"
version = "0.0.0"
description = "In-house Section 508 / WCAG fragment checkers for pytest, Playwright, and Selenium."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "soupsieve>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
